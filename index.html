<body>
  <div id="root"></div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            console.log('Service Worker registered', reg);
            // If SharedArrayBuffer is not available, we need COI headers active.
            // A reload might be necessary after the first SW registration.
            if (!window.crossOriginIsolated && !window.location.search.includes('reloaded')) {
              console.log('SharedArrayBuffer not available, reloading to activate SW headers...');
              setTimeout(() => {
                window.location.search += (window.location.search ? '&' : '?') + 'reloaded=true';
              }, 500);
            }
          })
          .catch(err => console.error('Service Worker registration failed', err));
      });
    }
  </script>
