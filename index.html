<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script src="./coi-serviceworker.js" data-coi-suppress-warning></script>
  <link rel="icon" type="image/png" href="./icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <title>Web Local LLM</title>
  <script type="module" crossorigin src="/assets/index-C5Vd8JAS.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-Btuu4hGC.css">
</head>

<body>
  <div id="root"></div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            console.log('Service Worker registered', reg);
            // If SharedArrayBuffer is not available, we need COI headers active.
            // A reload might be necessary after the first SW registration.
            if (!window.crossOriginIsolated && !window.location.search.includes('reloaded')) {
              console.log('SharedArrayBuffer not available, reloading to activate SW headers...');
              setTimeout(() => {
                window.location.search += (window.location.search ? '&' : '?') + 'reloaded=true';
              }, 500);
            }
          })
          .catch(err => console.error('Service Worker registration failed', err));
      });
    }
  </script>
</body>

</html>
